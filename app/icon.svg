<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <!-- Dark background -->
  <rect width="32" height="32" rx="5" fill="#06060f"/>
  <!-- "RHP" in white, bold, upper portion -->
  <text x="16" y="14"
    text-anchor="middle"
    font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-weight="800"
    font-size="13"
    fill="white"
    letter-spacing="-0.5">RHP</text>
  <!-- "creatives" in gradient, smaller, lower portion -->
  <text x="16" y="26"
    text-anchor="middle"
    font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-weight="600"
    font-size="7.5"
    fill="url(#g)"
    letter-spacing="-0.3">creatives</text>
</svg>
