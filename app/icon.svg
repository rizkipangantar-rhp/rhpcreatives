<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="2" y1="0" x2="30" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="5" fill="#06060f"/>
  <!-- RHP: larger font so it's visible at 16px tab size -->
  <text x="16" y="15"
    text-anchor="middle"
    font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-weight="900"
    font-size="16"
    fill="white"
    letter-spacing="-1">RHP</text>
  <!-- creatives: gradient, tighter letter-spacing to fit in 32px width -->
  <text x="16" y="28"
    text-anchor="middle"
    font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-weight="700"
    font-size="9"
    fill="url(#g)"
    letter-spacing="-1.5">creatives</text>
</svg>
