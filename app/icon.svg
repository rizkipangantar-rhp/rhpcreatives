<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="6" fill="url(#g)"/>
  <!-- Inner dark area -->
  <rect x="2" y="2" width="28" height="28" rx="5" fill="#06060f"/>
  <!-- "R" as paths: pixel-art 8×9 grid scaled to fit -->
  <!-- Row 0: full top bar -->
  <rect x="8"  y="7"  width="12" height="2" fill="url(#g)"/>
  <!-- Row 0-4: right vertical of top loop -->
  <rect x="18" y="7"  width="2" height="8" fill="url(#g)"/>
  <!-- Left vertical spine (full height) -->
  <rect x="8"  y="7"  width="2" height="18" fill="url(#g)"/>
  <!-- Middle bar (closes the loop) -->
  <rect x="8"  y="13" width="12" height="2" fill="url(#g)"/>
  <!-- Diagonal leg of R going down-right -->
  <rect x="14" y="15" width="2" height="3" fill="url(#g)"/>
  <rect x="16" y="18" width="2" height="2" fill="url(#g)"/>
  <rect x="18" y="20" width="2" height="2" fill="url(#g)"/>
  <rect x="20" y="22" width="2" height="3" fill="url(#g)"/>
</svg>
